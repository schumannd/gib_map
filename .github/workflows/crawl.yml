name: Crawl and deploy map

on:
  schedule:
    # Daily at 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-deploy
  cancel-in-progress: false

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore crawl progress
        uses: actions/cache/restore@v4
        id: crawl-cache
        with:
          path: |
            cache.pickle
            data
          key: crawl-progress-v1
          restore-keys: crawl-progress-v1

      - name: Bootstrap data from last deploy
        run: |
          if git fetch origin gh-pages --depth 1 2>/dev/null && \
             git show origin/gh-pages:days.js > days.js 2>/dev/null; then
            echo "Fetched days.js from gh-pages ($(wc -c < days.js) bytes)"
          else
            echo "No gh-pages days.js available for bootstrap"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          PYTHONUNBUFFERED: '1'
          GIB_THROTTLE_WAIT_MINUTES: '10'
        run: python -u crawl_gib.py

      - name: Save crawl progress
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            cache.pickle
            data
          key: crawl-progress-v1

      - name: Verify crawl output
        run: |
          test -s days.js
          python3 -c "import pathlib; text=pathlib.Path('days.js').read_text(); assert 'daysMeta' in text, 'daysMeta missing'"
          echo "days.js size: $(wc -c < days.js) bytes"

      - name: Prepare static site
        run: |
          if [ ! -s days.js ]; then
            echo "::error::days.js is missing or empty after crawl"
            exit 1
          fi
          mkdir -p _site/lib
          cp index.html main.js base.css days.js _site/
          cp lib/jquery.js _site/lib/
          echo "Deploying $(wc -c < days.js) bytes of days.js"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
