name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - main.js
      - base.css

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare static site
        run: |
          if [ ! -s days.js ]; then
            if git fetch origin gh-pages 2>/dev/null && git show origin/gh-pages:days.js > days.js 2>/dev/null; then
              echo "Using days.js from origin/gh-pages (last deployed crawl data)"
            elif git show 0a8acf3:days.js > days.js 2>/dev/null; then
              echo "Using days.js recovered from commit 0a8acf3"
            else
              echo "var days = [];" > days.js
              echo "::warning::No days.js found — map will be empty until a crawl completes"
            fi
          else
            echo "Using days.js from workspace"
          fi

          mkdir -p _site/lib
          cp index.html main.js base.css days.js _site/
          cp lib/jquery.js _site/lib/
          echo "Deploying $(wc -c < days.js) bytes of days.js"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true

  trigger-crawl-if-idle:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch crawl when none is running
        uses: actions/github-script@v7
        with:
          script: |
            const workflowFile = 'crawl.yml';
            const { owner, repo } = context.repo;

            for (const status of ['in_progress', 'queued', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                status,
                per_page: 1,
              });
              if (data.total_count > 0) {
                core.info(
                  `Crawl workflow already ${status} (run ${data.workflow_runs[0].id}) — skipping dispatch`
                );
                return;
              }
            }

            core.info('No crawl in progress — dispatching crawl workflow');
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: workflowFile,
              ref: 'main',
            });
