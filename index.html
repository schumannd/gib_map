<!DOCTYPE html>
<html lang="de">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gratis in Berlin – Karte</title>
  <link rel="stylesheet" type="text/css" href="base.css" />
  <script src="https://maps.google.com/maps/api/js?sensor=false&key=AIzaSyDuEpLTK8wVCLbAm_MhlB-OOeJ29vO_QVQ" type="text/javascript"></script>
  <script src="days.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <header id="header">
    <div id="header-content">
      <h1>Gratis in Berlin</h1>
      <p id="subtitle">Kostenlose Events auf der Karte</p>
    </div>
    <div id="stats">
      <span id="event-count">– Events</span>
      <span id="location-count">– Orte</span>
    </div>
  </header>

  <nav id="date_picker" aria-label="Tag auswählen" role="tablist"></nav>

  <div id="legend">
    <span class="legend-item"><span class="legend-dot legend-dot-exact"></span> Genauer Ort</span>
    <span class="legend-item"><span class="legend-dot legend-dot-approx"></span> Ungefährer Ort</span>
  </div>

  <div id="empty-state" hidden>
    <p>Noch keine Daten geladen.</p>
    <p>Führe <code>python crawl_gib.py</code> aus, um Events zu laden.</p>
  </div>

  <div id="map" role="tabpanel" aria-labelledby="day-tab-0"></div>

  <footer id="site-footer">
    <a href="https://www.gratis-in-berlin.de/" target="_blank" rel="noopener">Event-Daten von gratis-in-berlin.de</a>
  </footer>
</body>
</html>
