<!DOCTYPE html>
<html lang="de">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gratis in Berlin – Karte</title>
  <link rel="stylesheet" type="text/css" href="base.css" />
  <script src="https://maps.google.com/maps/api/js?sensor=false&key=AIzaSyDuEpLTK8wVCLbAm_MhlB-OOeJ29vO_QVQ" type="text/javascript"></script>
  <script src="days.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <header id="header">
    <button id="header-toggle" type="button" aria-expanded="true" aria-controls="header-panel">
      Menü
    </button>
    <div id="header-panel">
      <div id="header-content">
        <h1>Gratis in Berlin</h1>
        <p id="subtitle">Kostenlose Events auf der Karte</p>
      </div>
      <div id="stats">
        <span id="event-count">– Events</span>
        <span id="location-count">– Orte</span>
      </div>
    </div>
  </header>

  <div id="search-bar">
    <label for="event-search">Events filtern</label>
    <input id="event-search" type="search" placeholder="Titel durchsuchen…" autocomplete="off" />
    <button id="clear-search" type="button" hidden aria-label="Suche löschen">×</button>
  </div>

  <nav id="date_picker" aria-label="Tag auswählen" role="tablist">
    <div id="date_picker-handle" aria-hidden="true"></div>
  </nav>

  <div id="legend">
    <span class="legend-item"><span class="legend-dot legend-dot-exact"></span> Genauer Ort</span>
    <span class="legend-item"><span class="legend-dot legend-dot-approx"></span> Ungefährer Ort</span>
  </div>

  <div id="data-status" class="status-banner" hidden></div>

  <div id="empty-state" hidden>
    <p id="empty-state-title">Noch keine Daten geladen.</p>
    <p id="empty-state-message">Führe <code>python crawl_gib.py</code> aus, um Events zu laden.</p>
  </div>

  <div id="map" role="tabpanel" aria-labelledby="day-tab-0"></div>

  <footer id="site-footer">
    <a href="https://www.gratis-in-berlin.de/" target="_blank" rel="noopener">Event-Daten von gratis-in-berlin.de</a>
  </footer>
</body>
</html>
